services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./apps/server/.env

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - server